services:
  # PostgreSQL Database
  - type: pserv
    name: mbita-emmanuel-db
    env: docker
    plan: free
    databaseName: professor_website
    databaseUser: professor_user
    
  # Next.js Web Service
  - type: web
    name: mbita-emmanuel
    env: node
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: DATABASE_URL
        fromDatabase:
          name: mbita-emmanuel-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: PROFESSOR_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ORCID_ID
        sync: false
      - key: MFA_APP_NAME
        value: Professor Website
      - key: NEXT_PUBLIC_TAWKTO_ID
        sync: false
